name: Backend CI

# Run lint, unit tests and API tests (against PostgreSQL) for every pull request.
on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel outdated runs when new commits are pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install the exact dependency set from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Unit tests only (vitest default config); e2e tests are excluded.
      - name: Run unit tests
        run: npm test

  # API (e2e) tests run against a real PostgreSQL instance.
  api-tests:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable PostgreSQL service container.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grandstay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grandstay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only environment variables.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/grandstay_test
      JWT_ACCESS_SECRET: ci-test-secret-for-grandstay-api-tests
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies.
      - name: Install dependencies
        run: npm ci

      # Generate Prisma client.
      - name: Generate Prisma client
        run: npx prisma generate

      # Apply committed migrations.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # Run API/e2e tests.
      - name: Run API tests
        run: npm run test:e2e
